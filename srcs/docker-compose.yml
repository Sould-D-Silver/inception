services:
  mariadb:
    build: ./srcs/requirements/mariadb
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: 
      MYSQL_USER: 
      MYSQL_PASSWORD: 
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql


  volumes:
    mariadb_data:
      driver: local
    driver_opts:
      type: none
      device: home/sjoao/data/mariadb_data
      o: bind
      