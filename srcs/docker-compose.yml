services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE:
      MYSQL_USER:
      MYSQL_PASSWORD:
    ports:
      - "3306:3306"
    volumes:
      - mariadb:/var/lib/mysql


volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      device: /home/sjoao/data/mariadb
      o: bind
